services:
  - type: web
    name: task-hub
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin@123456
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: task-hub-db
    plan: free
    databaseName: taskhub
    user: taskhub_user
